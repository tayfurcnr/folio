services:
  collaboration:
    build:
      context: .
      target: collaboration
    environment:
      FOLIO_COLLAB_ALLOWED_ORIGINS: ${FOLIO_PUBLIC_ORIGIN:-https://localhost}
    volumes:
      - folio-data:/data
    expose:
      - "4175"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      FOLIO_DOMAIN: ${FOLIO_DOMAIN:-localhost}
    depends_on:
      collaboration:
        condition: service_healthy
    ports:
      - "${FOLIO_HTTP_PORT:-80}:80"
      - "${FOLIO_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  folio-data:
  caddy-data:
  caddy-config:
